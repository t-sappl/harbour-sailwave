<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 172" width="172" height="172">
  <!-- Sailwave app icon (since 1.1): a sailing boat whose mast is the
       antenna (three radio waves from the masthead), waves below, in the
       Sailfish OS "drop" (three rounded corners, bottom left pointed). Colours
       of the 1.0 icon (navy at the top, petrol at the bottom); depth as in
       Sailfeed: rim with a diagonal gradient, a slightly smaller inner face,
       a faint shine, a fine shadow under the motif. Refined: motif a bit
       smaller, left and lower (more room at the top right), radio waves 8 %
       smaller, water line fading out at both ends. PNGs in icons/ are
       rendered from this file with render-icons.py. -->
  <defs>
    <!-- Sailfish OS "drop": three rounded corners, bottom-left corner pointed;
         0.3 px gap per side at 86 px (Jolla icon guidelines) -->
    <path id="drop" d="M 86 0.6 A 85.4 85.4 0 0 1 171.4 86 A 85.4 85.4 0 0 1 86 171.4 L 10.6 171.4 A 10 10 0 0 1 0.6 161.4 L 0.6 86 A 85.4 85.4 0 0 1 86 0.6 Z"/>
    <linearGradient id="rim" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b7aa0"/><stop offset="1" stop-color="#06303f"/>
    </linearGradient>
    <linearGradient id="face" x1="0.65" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0f3d5e"/><stop offset="1" stop-color="#178a81"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.62" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="faceClip">
      <use href="#drop" transform="translate(86 86) scale(0.94) translate(-86 -86)"/>
    </clipPath>
    <!-- Water line fades out towards both ends, so it runs softly into the
         pointed corner on the left and the round edge on the right -->
    <linearGradient id="waterFade" gradientUnits="userSpaceOnUse" x1="-4" y1="0" x2="188" y2="0">
      <stop offset="0.02" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.20" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.78" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.92" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#021821" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Rim with a diagonal gradient, a slightly smaller inner face, a faint
       shine, a fine shadow under the motif (same depth as Sailfeed) -->
  <use href="#drop" fill="url(#rim)"/>
  <g transform="translate(86 86) scale(0.94) translate(-86 -86)">
    <use href="#drop" fill="url(#face)"/>
    <use href="#drop" fill="url(#shine)"/>
  </g>
  <!-- Water, clipped to the inner face -->
  <g clip-path="url(#faceClip)">
    <g transform="translate(86 87) scale(0.87) translate(-86 -86)">
      <path d="M -4 154 q 6 -8 12 -8 t 12 8 t 12 8 t 12 -8 t 12 -8 t 12 8 t 12 8 t 12 -8 t 12 -8 t 12 8 t 12 8 t 12 -8 t 12 -8 t 12 8 t 12 8 t 12 -8"
          fill="none" stroke="url(#waterFade)" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Motif slightly smaller and moved a little to the left and down: its
       visual centre sits on the main mass of the drop, with more room to the
       top and right edge -->
  <g transform="translate(82.5 88) scale(0.85) translate(-86 -86)">
    <g filter="url(#shadow)">
    <!-- Radio waves from the masthead -->
    <!-- 8 % smaller around the masthead: more distance to the round edge -->
    <g fill="none" stroke="#f6b92e" stroke-width="6.5" stroke-linecap="round"
       transform="translate(88 58) scale(0.92) translate(-88 -58)">
      <path d="M 92.1 42.5 A 16 16 0 0 1 103.5 62.1"/>
      <path d="M 95.5 30.0 A 29 29 0 0 1 116.0 65.5"/>
      <path d="M 98.9 17.4 A 42 42 0 0 1 128.6 68.9"/>
    </g>
    <circle cx="88" cy="58" r="6.5" fill="#f6b92e"/>
    <!-- Mast, mainsail, jib and hull -->
    <rect x="85.5" y="58" width="5" height="64" rx="2" fill="#ffffff"/>
    <path d="M 82 68 L 82 116 L 46 116 Z" fill="#ffffff"/>
    <path d="M 94 78 L 94 116 L 120 116 Z" fill="#ffffff" fill-opacity="0.85"/>
    <path d="M 36 122 L 136 122 L 121 140 L 51 140 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
