<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 172" width="172" height="172">
<!-- Sailwave app icon (since 1.1.1): sailing boat whose mast is the antenna
     (three radio waves), stylised wave line at the bottom (as in the 1.1 icon, not filled), in the Sailfish OS "drop".
     No rim: the face fills the whole drop (like Sailcast), depth from a soft
     light glow top left, a slight vignette towards the edge, a gloss at the
     top, a fine light/dark edge, gradients on the motif and a soft shadow
     under it. The wave line runs through from left to right, cut off by the
     drop. PNGs in icons/ are rendered from this file with render-icons.py. -->
<defs>
<path id="drop" d="M 86 0.6 A 85.4 85.4 0 0 1 171.4 86 A 85.4 85.4 0 0 1 86 171.4 L 10.6 171.4 A 10 10 0 0 1 0.6 161.4 L 0.6 86 A 85.4 85.4 0 0 1 86 0.6 Z"/>
<linearGradient id="rim" x1="0.15" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#5db6d8"/><stop offset="0.5" stop-color="#1d6a8e"/><stop offset="1" stop-color="#031c27"/></linearGradient>
<linearGradient id="face" x1="0.65" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#14507a"/><stop offset="0.55" stop-color="#136b78"/><stop offset="1" stop-color="#1fa08f"/></linearGradient>
<linearGradient id="bevel" x1="0.3" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.28"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.22"/></linearGradient>
<linearGradient id="glossG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.22" r="0.7"><stop offset="0" stop-color="#fff" stop-opacity="0.26"/><stop offset="0.6" stop-color="#fff" stop-opacity="0.05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx="0.42" cy="0.4" r="0.78"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#001018" stop-opacity="0.38"/></radialGradient>
<clipPath id="faceClip"><use href="#drop" transform="translate(86 86) scale(1.0) translate(-86 -86)"/></clipPath>
<linearGradient id="waterFade" gradientUnits="userSpaceOnUse" x1="-4" y1="0" x2="188" y2="0"><stop offset="0.02" stop-color="#fff" stop-opacity="0"/><stop offset="0.2" stop-color="#fff" stop-opacity="0.5"/><stop offset="0.78" stop-color="#fff" stop-opacity="0.5"/><stop offset="0.92" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="sailA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c9dde5"/></linearGradient>
<linearGradient id="sailB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef5f8"/><stop offset="1" stop-color="#a9c6d2"/></linearGradient>
<linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="0.5" stop-color="#e9f2f5"/><stop offset="1" stop-color="#a7c3cf"/></linearGradient>
<linearGradient id="mast" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b3ccd6"/></linearGradient>
<linearGradient id="gold" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#ffd966"/><stop offset="1" stop-color="#ee9418"/></linearGradient>
<radialGradient id="goldDot" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#ffe58a"/><stop offset="1" stop-color="#e98a12"/></radialGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0.8" dy="3.0" stdDeviation="2.2" flood-color="#01131b" flood-opacity="0.55"/></filter>
</defs>
<use href="#drop" fill="url(#rim)"/>
<g transform="translate(86 86) scale(1.0) translate(-86 -86)">
<use href="#drop" fill="url(#face)"/>
<use href="#drop" fill="none" stroke="url(#bevel)" stroke-width="2.4"/>
</g>
<g clip-path="url(#faceClip)">
<rect x="-2" y="-2" width="176" height="176" fill="url(#glow)"/>
<rect x="-2" y="-2" width="176" height="176" fill="url(#vig)"/>
<ellipse cx="96" cy="-34" rx="120" ry="84" fill="url(#glossG)"/>
<g transform="translate(86 86) scale(0.87) translate(-86 -86)"><path d="M -52 154 q 6 -8 12 -8 t 12 8 t 12 8 t 12 -8 q 6 -8 12 -8 t 12 8 t 12 8 t 12 -8 t 12 -8 t 12 8 t 12 8 t 12 -8 t 12 -8 t 12 8 t 12 8 t 12 -8 t 12 -8 t 12 8 t 12 8 t 12 -8" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/></g>
</g>
<g transform="translate(83 81) scale(0.935) translate(-86 -86)">
<g filter="url(#shadow)">
<g fill="none" stroke="url(#gold)" stroke-width="6.5" stroke-linecap="round" transform="translate(88 58) scale(0.92) translate(-88 -58)">
<path d="M 92.1 42.5 A 16 16 0 0 1 103.5 62.1"/><path d="M 95.5 30.0 A 29 29 0 0 1 116.0 65.5"/><path d="M 98.9 17.4 A 42 42 0 0 1 128.6 68.9"/>
</g>
<circle cx="88" cy="58" r="6.5" fill="url(#goldDot)"/>
<rect x="85.5" y="58" width="5" height="64" rx="2" fill="url(#mast)"/>
<path d="M 82 68 L 82 116 L 46 116 Z" fill="url(#sailA)"/>
<path d="M 94 78 L 94 116 L 120 116 Z" fill="url(#sailB)"/>
<path d="M 36 122 L 136 122 L 121 140 L 51 140 Z" fill="url(#hull)"/>
</g>
<path d="M 36.6 122.6 L 135.4 122.6" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
<path d="M 51.5 139.4 L 120.5 139.4" stroke="#5f8796" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
</g>
</svg>