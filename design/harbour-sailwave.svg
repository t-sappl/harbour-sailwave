<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 172" width="172" height="172">
  <!-- Sailwave app icon: the mast doubles as the antenna, the waves below
       are the second "wave" in the name. PNGs in icons/ are rendered from
       the same geometry. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3552"/>
      <stop offset="1" stop-color="#16857f"/>
    </linearGradient>
    <!-- Sailfish OS "drop": three fully rounded corners, bottom-left corner pointed.
         Fills the canvas except for the 0.3 px gap per side (at 86 px)
         that the Jolla icon guidelines ask for. -->
    <clipPath id="shape">
      <path d="M 86 0.6 A 85.4 85.4 0 0 1 171.4 86 A 85.4 85.4 0 0 1 86 171.4 L 10.6 171.4 A 10 10 0 0 1 0.6 161.4 L 0.6 86 A 85.4 85.4 0 0 1 86 0.6 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#shape)">
    <rect x="0" y="0" width="172" height="172" fill="url(#bg)"/>
    <g transform="translate(86 86) scale(0.87) translate(-86 -86)">

    <!-- Radio waves from the masthead -->
    <g fill="none" stroke="#f6b92e" stroke-width="6.5" stroke-linecap="round">
      <path d="M 92.1 42.5 A 16 16 0 0 1 103.5 62.1"/>
      <path d="M 95.5 30.0 A 29 29 0 0 1 116.0 65.5"/>
      <path d="M 98.9 17.4 A 42 42 0 0 1 128.6 68.9"/>
    </g>
    <circle cx="88" cy="58" r="6.5" fill="#f6b92e"/>

    <!-- Mast, mainsail, jib and hull -->
    <rect x="85.5" y="58" width="5" height="64" rx="2" fill="#ffffff"/>
    <path d="M 82 68 L 82 116 L 46 116 Z" fill="#ffffff"/>
    <path d="M 94 78 L 94 116 L 120 116 Z" fill="#ffffff" fill-opacity="0.85"/>
    <path d="M 36 122 L 136 122 L 121 140 L 51 140 Z" fill="#ffffff"/>

    <!-- Water -->
    <path d="M -4 154 q 6 -8 12 -8 t 12 8 t 12 8 t 12 -8 t 12 -8 t 12 8 t 12 8 t 12 -8 t 12 -8 t 12 8 t 12 8 t 12 -8 t 12 -8 t 12 8 t 12 8 t 12 -8"
          fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
